{% extends 'base/layout.html' %}

{% block body %}
  <div class="container py-5">
    <div class="row">
      <div class="col-lg-12">
        <h3>{{ job.title }}</h3>
        <p>Posted on {{ job.date|date:"jS F Y" }}</p>
      </div>
    </div>

    <div class="row blog-section">
      <div class="col-lg-12">
        <b>Salary: {{ job.salary }}</b>
      </div>
    </div>

    <div class="row blog-section">
      <div class="col-lg-12">
        <p> {{ job.content|linebreaks }}</p>
      </div>
    </div>
  </div>
{% endblock %}

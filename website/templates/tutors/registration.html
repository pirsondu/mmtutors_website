{% extends 'base/layout.html' %}

{% block body %}
<div class="container mt-5">
  <h3 class="text-center mb-4">Tutor Registration</h3>

  <div class="row">
    <!-- Academic & Other Subjects Tutor Option -->
    <div class="col-md-6">
      <div class="tutor-option">
        <h5>Academic Tutor Application</h5>
        <p>Apply to become a tutor for academic and other general subjects.</p>
        <a href="https://teachers.mmtutors.com/register/academic" aria-label="Apply to become an academic tutor">
          <button class="apply-btn">Apply Now</button>
        </a>
      </div>
    </div>

    <!-- Language Tutor Option -->
    <div class="col-md-6">
      <div class="tutor-option">
        <h5>Language Tutor Application</h5>
        <p>Apply to become a tutor for language teaching and learning.</p>
        <a href="https://teachers.mmtutors.com/register/language" aria-label="Apply to become a language tutor">
          <button class="apply-btn">Apply Now</button>
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
